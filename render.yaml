# Render Blueprint: the API (free web service). The database is Neon Postgres and
# the frontend is on Vercel; neither is defined here. See DEPLOYMENT_PLAN.md.
services:
  - type: web
    name: budget-api
    runtime: python
    plan: free
    region: virginia # keep in the same region as the Neon database
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free instances have no pre-deploy hook, so migrations run before the server
    # starts. That is safe with exactly one instance: do not scale this service
    # past 1 without moving migrations to a separate step.
    startCommand: >-
      alembic upgrade head &&
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w 1
      -b 0.0.0.0:$PORT
      --timeout 60 --graceful-timeout 30 --keep-alive 5
      --forwarded-allow-ips="*"
      --access-logfile - --error-logfile -
    healthCheckPath: /health
    # Deploy only after the GitHub CI checks pass on the commit (Render dashboard:
    # Auto-Deploy -> "After CI Checks Pass"). Replaces the older autoDeploy flag.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: BUDGET_APP_ENV
        value: prod
      - key: BUDGET_APP_TIMEZONE
        value: America/Toronto
      - key: BUDGET_APP_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Random 256-bit value generated by Render on first deploy.
      - key: BUDGET_APP_SECRET_KEY
        generateValue: true
      # Neon connection string (direct, not -pooler) with ?sslmode=require.
      - key: BUDGET_APP_DATABASE_URL
        sync: false
      # Exact origin of the Vercel site, e.g. https://budget-tracker.vercel.app
      - key: BUDGET_APP_CORS_ORIGINS
        sync: false
